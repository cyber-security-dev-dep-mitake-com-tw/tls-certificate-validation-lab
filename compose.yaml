name: tls-certificate-validation-lab
services:
  svc1:
    build: .
    command: ["/usr/local/bin/svc1"]
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN:-tls-lab.example.test}
      LAB_STATE: /state
      LAB_TRUST: /trust
      LAB_BIND: 0.0.0.0
      LAB_ADVERTISED_HOST: svc1
      JULIA_GENERATE: /opt/lab/julia/generate.jl
      POSSESSION_BIN: /usr/local/bin/possession
    volumes:
      - lab_trust:/trust
    networks:
      - lab_internal
    healthcheck:
      test: ["CMD", "test", "-f", "/state/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s
    restart: "no"
    security_opt:
      - no-new-privileges:true
  svc2:
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["/usr/local/bin/harness"]
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN:-tls-lab.example.test}
      LAB_HOST: svc1
      LAB_TRUST_FILE: /trust/trusted_root_ca.pem
      LAB_POLICY_DIR: /trust
      LAB_POSSESSION_LEAF: /trust/possession_leaf.pem
      REPORT_DIR: /reports
      JULIA_ANALYZE: /opt/lab/julia/analyze.jl
      JULIA_ORACLE: /opt/lab/julia/oracle.jl
      LAB_LLM_PROVIDER: ${LAB_LLM_PROVIDER:-disabled}
    volumes:
      - lab_trust:/trust:ro
      - ./reports:/reports
    networks:
      - lab_internal
    depends_on:
      svc1:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"
networks:
  lab_internal:
    internal: true
volumes:
  lab_trust: {}
